<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 商品抓取工具 Mac 版</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="brand-icon">M</div>
            <h1>商品采集 Mac</h1>
            <p>本地商品管理与主系统同步</p>
        </div>
        <div class="login-card">
            <form id="login-form" onsubmit="doLogin(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-wrap">
                        <span class="input-icon">U</span>
                        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username" autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-wrap">
                        <span class="input-icon">P</span>
                        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
                    </div>
                </div>
                <div class="form-group remember-row">
                    <input type="checkbox" id="remember">
                    <label for="remember">记住密码</label>
                </div>
                <button type="submit" class="btn btn-primary btn-login" id="btn-login">登录</button>
            </form>
            <div class="login-error" id="login-error"></div>
            <div class="login-hint">默认账号：admin / admin123</div>
        </div>
    </div>

    <script>
        (async function() {
            try {
                const res = await fetch('/api/saved-cred');
                const data = await res.json();
                if (data.saved) {
                    document.getElementById('username').value = data.username || '';
                    document.getElementById('password').value = data.password || '';
                    document.getElementById('remember').checked = true;
                }
            } catch {}
        })();

        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errEl = document.getElementById('login-error');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = '登录中...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    if (remember) {
                        await fetch('/api/saved-cred', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password }),
                        });
                    } else {
                        await fetch('/api/saved-cred', { method: 'DELETE' });
                    }
                    window.location.href = '/';
                } else {
                    errEl.textContent = data.error || '登录失败';
                    errEl.style.display = 'block';
                }
            } catch {
                errEl.textContent = '网络异常，请重试';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }
    </script>
</body>
</html>
