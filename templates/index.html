<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品抓取工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <span class="app-title">商品抓取工具</span>
            <span class="status-chip" id="proxy-chip">代理：检查中…</span>
            <span class="status-chip" id="health-chip" title="点击查看健康详情" onclick="refreshHealth(true)">健康检查中…</span>
        </div>
        <div class="toolbar-center"></div>
        <div class="toolbar-right"></div>
    </div>

    <div class="sync-bar">
        <div>微信小程序 / 美团商品抓包 —— 软件打开即自动抓取，抓到一条自动上传后台商品库（来源平台：小程序美团）。关闭软件自动停止。</div>
        <div id="proxy-status-text" class="sync-status">代理状态：检查中…</div>
    </div>

    <div class="product-section">
        <div class="product-header">
            <input type="text" id="search-input" class="search-input" placeholder="搜索商品名/店铺名/UPC..." oninput="searchProducts()">
            <button class="btn btn-primary" onclick="showAddModal()">新增商品</button>
        </div>
        <div class="table-wrapper">
            <table class="product-table">
                <thead>
                    <tr>
                        <th>SKU ID</th>
                        <th>门店</th>
                        <th>UPC</th>
                        <th>商品名</th>
                        <th>图片</th>
                        <th>规格</th>
                        <th>原价</th>
                        <th>售价</th>
                        <th>月销</th>
                        <th>同步时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="product-tbody"></tbody>
            </table>
        </div>
    </div>

    <div class="log-section" id="log-section">
        <div class="log-header">
            <span>日志</span>
            <span id="log-count" class="log-count">0 条</span>
        </div>
        <div class="log-panel" id="log-panel"></div>
    </div>

    <div class="modal-overlay" id="modal-overlay" style="display:none" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="modal-title">新增商品</span>
                <button class="btn-close" onclick="hideModal()">&times;</button>
            </div>
            <form id="product-form" onsubmit="submitProduct(event)">
                <input type="hidden" id="form-id">
                <div class="form-row">
                    <label>来源平台</label>
                    <input type="text" id="form-source-platform" value="wechat_meituan">
                </div>
                <div class="form-row">
                    <label>SKU ID</label>
                    <input type="text" id="form-sku-id" required>
                </div>
                <div class="form-row">
                    <label>门店名</label>
                    <input type="text" id="form-poi-name" required>
                </div>
                <div class="form-row">
                    <label>商品名</label>
                    <input type="text" id="form-product-name" required>
                </div>
                <div class="form-row">
                    <label>UPC</label>
                    <input type="text" id="form-upc">
                </div>
                <div class="form-row">
                    <label>规格</label>
                    <input type="text" id="form-spec">
                </div>
                <div class="form-row">
                    <label>原价</label>
                    <input type="number" step="0.01" id="form-origin-price" value="0">
                </div>
                <div class="form-row">
                    <label>售价</label>
                    <input type="number" step="0.01" id="form-price" value="0">
                </div>
                <div class="form-row">
                    <label>库存</label>
                    <input type="number" id="form-stock" value="0">
                </div>
                <div class="form-row">
                    <label>图片 JSON</label>
                    <textarea id="form-product-pic" rows="3">[]</textarea>
                </div>
                <div class="form-row">
                    <label>原始 JSON</label>
                    <textarea id="form-raw-json" rows="5"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="hideModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="json-overlay" style="display:none" onclick="closeJsonModal(event)">
        <div class="modal modal-wide" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>完整 JSON</span>
                <div>
                    <button class="btn btn-sm btn-secondary" onclick="copyJson()">复制</button>
                    <button class="btn-close" onclick="hideJsonModal()">&times;</button>
                </div>
            </div>
            <pre class="json-content" id="json-content"></pre>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
